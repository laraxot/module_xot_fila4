<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <defs>
        <!-- Gradient per glow effect -->
        <linearGradient id="xot-glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:currentColor;stop-opacity:0.9" />
            <stop offset="100%" style="stop-color:currentColor;stop-opacity:0.5" />
        </linearGradient>
        
        <!-- Gradient per orbite -->
        <linearGradient id="orbit-glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:currentColor;stop-opacity:0.6" />
            <stop offset="50%" style="stop-color:currentColor;stop-opacity:0.3" />
            <stop offset="100%" style="stop-color:currentColor;stop-opacity:0.6" />
        </linearGradient>
        
        <!-- Filter per glow effect -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <style>
        /* Animazioni eleganti e professionali */
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.02);
            }
        }
        
        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        
        @keyframes orbit {
            0% {
                transform: rotate(0deg) translateX(9px) rotate(0deg);
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: rotate(360deg) translateX(9px) rotate(-360deg);
                opacity: 0.7;
            }
        }
        
        @keyframes orbit-reverse {
            0% {
                transform: rotate(360deg) translateX(7px) rotate(-360deg);
                opacity: 0.6;
            }
            50% {
                opacity: 0.9;
            }
            100% {
                transform: rotate(0deg) translateX(7px) rotate(0deg);
                opacity: 0.6;
            }
        }
        
        @keyframes draw-path {
            from {
                stroke-dashoffset: 100;
                opacity: 0;
            }
            to {
                stroke-dashoffset: 0;
                opacity: 1;
            }
        }
        
        @keyframes fade-in {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        @keyframes glow-pulse {
            0%, 100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }
        
        /* Core X - elemento principale */
        .xot-core {
            animation: pulse 3s ease-in-out infinite;
            filter: url(#glow);
        }
        
        /* Orbite esterne */
        .xot-orbit {
            animation: rotate 20s linear infinite;
            transform-origin: center;
        }
        
        /* Moduli orbitanti */
        .xot-module {
            animation: orbit 15s linear infinite;
            transform-origin: center;
        }
        
        .xot-module-2 {
            animation: orbit-reverse 12s linear infinite;
            animation-delay: -3s;
            transform-origin: center;
        }
        
        .xot-module-3 {
            animation: orbit 18s linear infinite;
            animation-delay: -6s;
            transform-origin: center;
        }
        
        /* Linee connessione */
        .xot-connection {
            stroke-dasharray: 100;
            animation: draw-path 2s ease-out forwards;
            opacity: 0.4;
        }
        
        /* Cerchi orbitanti */
        .xot-circle {
            animation: fade-in 1.5s ease-out forwards, glow-pulse 3s ease-in-out infinite;
            animation-delay: 0.5s;
            opacity: 0;
        }
        
        /* Hover effects */
        svg:hover .xot-core {
            animation-duration: 1.5s;
            filter: url(#glow);
        }
        
        svg:hover .xot-orbit {
            animation-duration: 10s;
        }
        
        svg:hover .xot-module {
            animation-duration: 8s;
        }
        
        svg:hover .xot-module-2 {
            animation-duration: 6s;
        }
        
        svg:hover .xot-module-3 {
            animation-duration: 9s;
        }
        
        svg:hover .xot-connection {
            opacity: 0.6;
            stroke-width: 1.2;
        }
        
        /* Accessibilità - rispetta preferenze utente */
        @media (prefers-reduced-motion: reduce) {
            .xot-core,
            .xot-orbit,
            .xot-module,
            .xot-module-2,
            .xot-module-3,
            .xot-connection,
            .xot-circle {
                animation: none;
                opacity: 1;
            }
        }
        
        @media (prefers-color-scheme: dark) {
            .xot-core {
                opacity: 0.95;
            }
            .xot-connection {
                opacity: 0.5;
            }
        }
    </style>
    
    <!-- Orbita esterna -->
    <g class="xot-orbit">
        <circle cx="12" cy="12" r="9" stroke="url(#orbit-glow)" stroke-width="0.5" opacity="0.4" stroke-dasharray="1 3" />
        <circle cx="12" cy="12" r="7.5" stroke="url(#orbit-glow)" stroke-width="0.5" opacity="0.3" stroke-dasharray="1 2" />
    </g>
    
    <!-- Connessioni modulari (linee che collegano al centro) -->
    <g class="xot-connection">
        <line x1="12" y1="12" x2="18" y2="12" opacity="0.3" stroke-width="0.8" />
        <line x1="12" y1="12" x2="6" y2="12" opacity="0.3" stroke-width="0.8" />
        <line x1="12" y1="12" x2="12" y2="6" opacity="0.3" stroke-width="0.8" />
        <line x1="12" y1="12" x2="12" y2="18" opacity="0.3" stroke-width="0.8" />
        <line x1="12" y1="12" x2="15.88" y2="8.12" opacity="0.25" stroke-width="0.6" />
        <line x1="12" y1="12" x2="15.88" y2="15.88" opacity="0.25" stroke-width="0.6" />
        <line x1="12" y1="12" x2="8.12" y2="8.12" opacity="0.25" stroke-width="0.6" />
        <line x1="12" y1="12" x2="8.12" y2="15.88" opacity="0.25" stroke-width="0.6" />
    </g>
    
    <!-- Moduli orbitanti (rappresentano i moduli del framework) -->
    <g class="xot-module">
        <circle cx="12" cy="12" r="1.5" fill="none" stroke-width="1.2" opacity="0.8" />
        <circle cx="12" cy="12" r="0.5" fill="currentColor" opacity="0.6" />
    </g>
    
    <g class="xot-module-2">
        <circle cx="12" cy="12" r="1.2" fill="none" stroke-width="1" opacity="0.7" />
        <circle cx="12" cy="12" r="0.4" fill="currentColor" opacity="0.5" />
    </g>
    
    <g class="xot-module-3">
        <circle cx="12" cy="12" r="1" fill="none" stroke-width="0.8" opacity="0.6" />
        <circle cx="12" cy="12" r="0.3" fill="currentColor" opacity="0.4" />
    </g>
    
    <!-- Core X - rappresenta Xot, il cuore del framework -->
    <g class="xot-core">
        <!-- Cerchio centrale -->
        <circle cx="12" cy="12" r="5" stroke-width="1.5" opacity="0.9" />
        
        <!-- Lettera X stilizzata in stile Heroicon -->
        <path d="M9.5 9.5L14.5 14.5M14.5 9.5L9.5 14.5" stroke-width="2" opacity="1" />
        
        <!-- Punto centrale -->
        <circle cx="12" cy="12" r="1" fill="currentColor" opacity="0.8" />
    </g>
    
    <!-- Punti di estensione (extension points) -->
    <g class="xot-circle">
        <circle cx="3" cy="3" r="0.6" fill="currentColor" opacity="0.5" />
        <circle cx="21" cy="3" r="0.6" fill="currentColor" opacity="0.5" />
        <circle cx="3" cy="21" r="0.6" fill="currentColor" opacity="0.5" />
        <circle cx="21" cy="21" r="0.6" fill="currentColor" opacity="0.5" />
    </g>
</svg>
